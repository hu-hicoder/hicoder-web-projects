version: 2
updates:
  # npm / pnpm dependencies
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 10
    groups:
      # Bundle non-major updates into a single PR to reduce noise
      npm-minor-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions used in .github/workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Asia/Tokyo"
    groups:
      github-actions:
        update-types:
          - minor
          - patch
