name: Security auto-fix

on:
  schedule:
    # 毎週月曜 01:00 UTC（= 10:00 JST）。
    # Dependabot が直せない transitive 依存の脆弱性を pnpm audit --fix=override で自動修正し PR を作成する。
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  audit-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply pnpm audit fixes
        run: pnpm audit --fix=override || true

      - name: Sync lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify build
        if: steps.diff.outputs.changed == 'true'
        run: pnpm build

      - name: Create or update PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH=security/audit-fix
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add pnpm-workspace.yaml pnpm-lock.yaml
          git commit -m "fix(security): apply pnpm audit --fix=override"
          git push -f origin "$BRANCH"
          gh pr view "$BRANCH" --json number > /dev/null 2>&1 \
            || gh pr create --base main --head "$BRANCH" \
                --title "fix(security): pnpm audit --fix=override による脆弱性修正" \
                --body "$(cat <<'BODY'
## 概要

\`pnpm audit --fix=override\` を実行し、Dependabot が直せない transitive 依存の脆弱性を \`pnpm-workspace.yaml\` の \`overrides\` で修正しました。

## 検証済み

- ワークフロー内で \`pnpm build\` が成功していることを確認済み。

## 注意

このPRは \`GITHUB_TOKEN\` によって作成されているため、\`CI / build\` チェックが自動実行されません。
管理者はワークフローの build ログを確認のうえ、手動でマージしてください。
BODY
)"
